version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: boldideas-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: boldideas
      POSTGRES_PASSWORD: boldideas_dev
      POSTGRES_DB: boldideas
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
